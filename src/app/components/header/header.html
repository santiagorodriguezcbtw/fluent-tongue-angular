<header class="border-b border-border/60 bg-background">
  <div class="mx-auto max-w-7xl px-4 py-4 flex items-center gap-3">
    <a
      [routerLink]="['/home']"
      type="button"
      class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-border/60 bg-card text-foreground shadow-sm transition hover:bg-muted"
      aria-label="Go back"
    >
      <app-chevron-left-icon [size]="18" />
    </a>

    <p class="flex-1 text-foreground text-xl font-semibold tracking-tight line-clamp-2">
      {{ subTitle() || title() }}
    </p>
  </div>
</header>
